<svg viewBox="0 0 520 200" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Arrow marker for velocity vectors -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3b82f6" />
    </marker>
    <!-- Arrow marker for dimension lines -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 2 L 8 5 L 0 8 z" fill="#ef4444" />
    </marker>
  </defs>

  <!-- Pipe Walls -->
  <g id="pipe-walls" stroke="#475569" stroke-width="3" stroke-linecap="round">
    <line x1="50" y1="50" x2="480" y2="50" />
    <line x1="50" y1="150" x2="480" y2="150" />
  </g>

  <!-- Pipe Centerline Axis -->
  <line x1="30" y1="100" x2="500" y2="100" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- Developing region boundaries / boundary layer growth -->
  <path d="M 50 50 C 180 80, 320 98, 420 100" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.6" />
  <path d="M 50 150 C 180 120, 320 102, 420 100" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3" fill="none" opacity="0.6" />

  <!-- Flow velocity profiles -->
  <!-- 1. Entrance (Flat profile) -->
  <g id="entrance-profile">
    <line x1="50" y1="50" x2="50" y2="150" stroke="#3b82f6" stroke-width="2.5" />
    <g stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)">
      <line x1="50" y1="65" x2="80" y2="65" />
      <line x1="50" y1="82" x2="80" y2="82" />
      <line x1="50" y1="100" x2="80" y2="100" />
      <line x1="50" y1="118" x2="80" y2="118" />
      <line x1="50" y1="135" x2="80" y2="135" />
    </g>
  </g>

  <!-- 2. Developing Profile -->
  <g id="developing-profile">
    <path d="M 220 50 Q 235 75 245 80 L 245 120 Q 235 125 220 150" stroke="#3b82f6" stroke-width="2" fill="none" />
    <g stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)">
      <line x1="220" y1="65" x2="237" y2="65" />
      <line x1="220" y1="82" x2="245" y2="82" />
      <line x1="220" y1="100" x2="245" y2="100" />
      <line x1="220" y1="118" x2="245" y2="118" />
      <line x1="220" y1="135" x2="237" y2="135" />
    </g>
  </g>

  <!-- 3. Fully Developed Profile -->
  <g id="fully-developed-profile">
    <path d="M 410 50 Q 475 100 410 150" stroke="#3b82f6" stroke-width="2" fill="none" />
    <g stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)">
      <line x1="410" y1="65" x2="435" y2="65" />
      <line x1="410" y1="82" x2="463" y2="82" />
      <line x1="410" y1="100" x2="473" y2="100" />
      <line x1="410" y1="118" x2="463" y2="118" />
      <line x1="410" y1="135" x2="435" y2="135" />
    </g>
  </g>

  <!-- Dimensions and labels -->
  <!-- 1. Entrance Length le -->
  <g id="dimension-le">
    <line x1="50" y1="30" x2="410" y2="30" stroke="#ef4444" stroke-width="1.5" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)" />
    <!-- Extension lines -->
    <line x1="50" y1="35" x2="50" y2="45" stroke="#ef4444" stroke-width="1" />
    <line x1="410" y1="35" x2="410" y2="95" stroke="#ef4444" stroke-width="1" stroke-dasharray="2 2" />
    <text x="230" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-style="italic" font-weight="bold" fill="#ef4444" text-anchor="middle">l_e</text>
  </g>

  <!-- 2. Diameter D -->
  <g id="dimension-d">
    <line x1="25" y1="50" x2="25" y2="150" stroke="#ef4444" stroke-width="1.5" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)" />
    <!-- Extension lines -->
    <line x1="30" y1="50" x2="45" y2="50" stroke="#ef4444" stroke-width="1" />
    <line x1="30" y1="150" x2="45" y2="150" stroke="#ef4444" stroke-width="1" />
    <text x="14" y="105" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-style="italic" font-weight="bold" fill="#ef4444" text-anchor="middle">D</text>
  </g>
</svg>
