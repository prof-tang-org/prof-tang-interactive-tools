<svg viewBox="0 0 700 440" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569" />
    </marker>
    <marker id="cycle-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb" />
    </marker>
  </defs>

  <g id="axes" stroke="#475569" stroke-width="2.5" fill="none">
    <line x1="95" y1="365" x2="635" y2="365" marker-end="url(#axis-arrow)" />
    <line x1="95" y1="365" x2="95" y2="45" marker-end="url(#axis-arrow)" />
  </g>

  <g id="cycle" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 555 315 C 455 290, 330 235, 225 210" marker-end="url(#cycle-arrow)" />
    <path d="M 225 210 L 225 85" marker-end="url(#cycle-arrow)" />
    <path d="M 225 85 C 340 115, 455 190, 555 250" marker-end="url(#cycle-arrow)" />
    <path d="M 555 250 L 555 315" marker-end="url(#cycle-arrow)" />
  </g>

  <g id="states" fill="#ffffff" stroke="#1e293b" stroke-width="3">
    <circle cx="555" cy="315" r="7" />
    <circle cx="225" cy="210" r="7" />
    <circle cx="225" cy="85" r="7" />
    <circle cx="555" cy="250" r="7" />
  </g>

  <g id="labels" font-family="system-ui, -apple-system, sans-serif" fill="#1e293b">
    <text x="365" y="410" font-size="18" text-anchor="middle">Specific volume, v</text>
    <text x="38" y="205" font-size="18" text-anchor="middle" transform="rotate(-90 38 205)">Pressure, p</text>
    <text x="570" y="326" font-size="17" text-anchor="start">1</text>
    <text x="205" y="226" font-size="17" text-anchor="end">2</text>
    <text x="205" y="82" font-size="17" text-anchor="end">3</text>
    <text x="570" y="255" font-size="17" text-anchor="start">4</text>
    <text x="382" y="300" font-size="15" text-anchor="middle">1-2 Isentropic compression</text>
    <text x="330" y="62" font-size="15" text-anchor="middle">2-3 Isochoric heat addition</text>
    <text x="410" y="110" font-size="15" text-anchor="middle">3-4 Isentropic expansion</text>
    <text x="570" y="214" font-size="15" text-anchor="start">4-1 Isochoric</text>
    <text x="570" y="234" font-size="15" text-anchor="start">heat rejection</text>
  </g>
</svg>
